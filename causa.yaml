# yaml-language-server: $schema=.causa/configuration-schema.yaml

workspace:
  name: causa

causa:
  modules:
    "@causa/workspace-core": ^1.0.0
    "@causa/workspace-google": ^1.0.0
    "@causa/workspace-typescript": ^1.0.0

project:
  name: runtime-typescript-google
  description: An extension to the Causa runtime SDK (`@causa/runtime`), providing Google-specific features.
  language: typescript
  type: package

javascript:
  dependencies:
    check:
      allowlist:
        - GHSA-w5hq-g745-h8pq
    update:
      packageTargets:
        "@types/node": minor
        typescript: minor

google:
  firestore:
    securityRuleFiles: [firestore.rules]
    securityRuleFile: .causa/firestore.rules
  firebaseStorage:
    securityRuleFile: .causa/storage.rules
